<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudySync – Study Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth" class="authwrap">
  <form id="authForm" class="panel authcard">
    <h1>StudySync</h1>
    <p class="muted">Plan your tasks, track progress and share study material with your group.</p>
    <label>Username<input id="aUser" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username"></label>
    <label>Password<input id="aPass" type="password" required minlength="4" autocomplete="current-password"></label>
    <p id="aErr" class="late" role="alert"></p>
    <div class="row"><button value="login">Log in</button><button class="ghost" value="register">Create account</button></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <h1>StudySync</h1>
    <nav id="nav" aria-label="Main">
      <button data-view="dashboard" class="on">Dashboard</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="groups">Groups</button>
      <button data-view="focus">Focus timer</button>
    </nav>
    <div class="who"><span id="whoName"></span> <button class="ghost small" id="logout">Log out</button></div>
  </header>
  <div id="alerts" aria-live="polite"></div>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
