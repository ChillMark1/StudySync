<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudySync – Study Planner</title>
<meta name="description" content="Plan study tasks by subject, set deadlines and priorities, and track your progress.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>StudySync</h1>
  <nav id="nav" aria-label="Main">
    <button data-view="dashboard" class="on">Dashboard</button>
    <button data-view="tasks">Tasks</button>
    <button data-view="subjects">Subjects</button>
    <button data-view="groups">Study groups</button>
  </nav>
</header>

<div id="alerts" aria-live="polite"></div>

<main>
  <!-- Dashboard -->
  <section id="view-dashboard" class="view">
    <div class="hero">
      <div class="ring" id="ring"><span id="ringText">0%</span></div>
      <div>
        <h2 id="heroTitle">Your progress</h2>
        <p id="heroSub" class="muted"></p>
        <button id="notifyBtn" class="ghost">Enable browser reminders</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="cols">
      <div class="panel"><h3>Progress by subject</h3><div id="subjectBars"></div></div>
      <div class="panel"><h3>Coming up</h3><ul class="list" id="upcoming"></ul></div>
    </div>
  </section>

  <!-- Tasks -->
  <section id="view-tasks" class="view" hidden>
    <form id="taskForm" class="panel grid" autocomplete="off">
      <h3>Add a task</h3>
      <input type="hidden" id="tId">
      <label>Task<input id="tTitle" required maxlength="100" placeholder="e.g. Finish chapter 4 exercises"></label>
      <label>Subject<select id="tSubject" required></select></label>
      <label>Deadline<input id="tDeadline" type="datetime-local" required></label>
      <label>Priority
        <select id="tPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>
      </label>
      <label class="wide">Notes (optional)<input id="tNotes" maxlength="200"></label>
      <div class="wide row">
        <button type="submit" id="tSave">Add task</button>
        <button type="button" class="ghost" id="tCancel" hidden>Cancel edit</button>
      </div>
    </form>
    <div class="filters">
      <select id="fStatus" aria-label="Status"><option value="open">Open</option><option value="done">Done</option><option value="all">All</option></select>
      <select id="fSubject" aria-label="Subject filter"></select>
      <select id="fSort" aria-label="Sort"><option value="deadline">Sort by deadline</option><option value="priority">Sort by priority</option></select>
    </div>
    <ul class="list" id="taskList"></ul>
  </section>

  <!-- Subjects -->
  <section id="view-subjects" class="view" hidden>
    <form id="subjectForm" class="panel row" autocomplete="off">
      <input id="sName" required maxlength="40" placeholder="New subject name" aria-label="Subject name">
      <input id="sColor" type="color" value="#3a5bd9" aria-label="Subject colour">
      <button type="submit">Add subject</button>
    </form>
    <ul class="list" id="subjectList"></ul>
  </section>

  <!-- Study groups -->
  <section id="view-groups" class="view" hidden>
    <form id="groupForm" class="panel grid" autocomplete="off">
      <h3>Create a study group</h3>
      <label>Group name<input id="gName" required maxlength="50"></label>
      <label>Subject<select id="gSubject"></select></label>
      <label class="wide">Members (comma separated)<input id="gMembers" placeholder="Anna, Ravi, Mark"></label>
      <div class="wide"><button type="submit">Create group</button></div>
    </form>
    <ul class="list" id="groupList"></ul>
  </section>
</main>

<footer>StudySync · data is saved in this browser only.</footer>
<script src="js/app.js"></script>
</body>
</html>
